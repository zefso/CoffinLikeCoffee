<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horyzont - Logowanie</title>
    <link rel="stylesheet" href="/static/css/site.css">
    <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body class="auth-page">

<div class="auth-card">
    <h2 class="auth-title">Logowanie</h2>

    {% if form.errors %}
        <div class="auth-error">
            Nieprawidłowy login lub hasło. Spróbuj ponownie.
        </div>
    {% endif %}

    <form method="post" class="auth-form">
        {% csrf_token %}

        <div class="form-group">
            <label for="id_username">Nazwa użytkownika (login):</label>
            <input type="text" name="username" id="id_username" required autocomplete="username">
        </div>

        <div class="form-group">
            <label for="id_password">Hasło:</label>
            <input type="password" name="password" id="id_password" required autocomplete="current-password">
        </div>

        <button type="submit" class="auth-btn">Zaloguj się</button>
    </form>
</div>

</body>
</html>
